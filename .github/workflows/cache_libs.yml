name: Cache library dependencies

on:
  workflow_call:
    # NOTE: Windows library versions are defined in vcpkg.json
    inputs:
      ZLIB_VERSION:
        default: "1.4"
        required: false
        type: string
      LIBICONV_VERSION:
        default: "1.19"
        required: false
        type: string
      LIBXML2_VERSION:
        default: "2.15.4"
        required: false
        type: string
      LIBXSLT_VERSION:
        default: "1.1.45"
        required: false
        type: string

    outputs:
      ZLIB_VERSION:
        value: ${{ inputs.ZLIB_VERSION }}
      LIBICONV_VERSION:
        value: ${{ inputs.LIBICONV_VERSION }}
      LIBXML2_VERSION:
        value: ${{ inputs.LIBXML2_VERSION }}
      LIBXSLT_VERSION:
        value: ${{ inputs.LIBXSLT_VERSION }}


jobs:
  cache_libs:
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-22.04"
          - "ubuntu-22.04-arm"
          - "macos-latest"
          - "windows-2022"    # win32
          - "windows-latest"  # win_amd64
          - "windows-11-arm"

    runs-on: ${{ matrix.os }}

    env:
      ZLIB_VERSION: ${{ contains(matrix.os, 'windows-') && inputs.WIN_ZLIB_VERSION || inputs.ZLIB_VERSION }}
      LIBICONV_VERSION: ${{ contains(matrix.os, 'windows-') && inputs.WIN_LIBICONV_VERSION || inputs.LIBICONV_VERSION }}
      LIBXML2_VERSION: ${{ contains(matrix.os, 'windows-') && inputs.WIN_LIBXML2_VERSION || inputs.LIBXML2_VERSION }}
      LIBXSLT_VERSION: ${{ contains(matrix.os, 'windows-') && inputs.WIN_LIBXSLT_VERSION || inputs.LIBXSLT_VERSION }}

    steps:
    - name: Check out the repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache [libs]
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          libs/*.xz
          libs/*.gz
          libs/*.zip
        key: libs-${{ runner.os }}-${{ matrix.os == 'windows-2022' && 'i686' || runner.arch }}-${{ env.LIBXML2_VERSION }}-${{ env.LIBXSLT_VERSION }}-${{ env.LIBICONV_VERSION }}-${{ env.ZLIB_VERSION }}

    - name: Download latest libraries
      env:
        GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 buildlibxml.py --download-only  ${{ matrix.os == 'windows-2022' && 'win32' || '' }}
